[project]
name = "ailan-server"
version = "0.1.0"
description = "Ailan 教学平台后端：教案、课件、AI 助手与知识库服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "boto3>=1.35",
    "aiosmtplib>=3.0",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    # 上下文预算按真实分词计数：模型各自的 tokenizer 拿不到，cl100k 与国产模型的差异
    # 只在几成之间，比按字符数估准得多
    "tiktoken>=0.8",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "pypdf>=5.1",
    "fonttools>=4.55",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ailan"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008：依赖注入惯用 FastAPI 的 Depends(...) 作参数默认值
# RUF001/002/003：注释与 docstring 通篇中文，全角标点会被判成「易混淆的半角符号」，
#   整仓两千多条告警全是这一类，属于规则和项目文风冲突，直接关掉
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 提示词正文是给模型读的一整句话，为凑 110 列从中间断开会让规则读起来不像一条，
# 也让 review 时看不出哪些内容属于同一条约束
"src/ailan/ai_chat/agent/prompt.py" = ["E501"]
# 邮件模板是一整段内联样式的 HTML，按标签成行才看得出结构；
# 三引号字符串内部也没法逐行 noqa，只能整文件放行
"src/ailan/mail/service.py" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
