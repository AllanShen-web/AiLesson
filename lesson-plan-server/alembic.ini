# Table-structure migrations. The database URL and schema are NOT set here:
# migrations/env.py reads them from ailan.core.config.settings, so migrations and the
# running service always resolve the same environment variables.
#
# Comments stay ASCII on purpose - Alembic opens this file with the OS locale encoding,
# which is not UTF-8 on a Chinese Windows.

[alembic]
script_location = migrations
# src layout: `alembic` works straight from a fresh venv, without installing the package
prepend_sys_path = src
version_path_separator = os
# Sequential ids (`alembic revision --rev-id 0002 --autogenerate "..."`) instead of the
# default random hex: reading versions/ then shows the order things were built in.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
